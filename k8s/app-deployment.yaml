apiVersion: apps/v1
kind: Deployment
metadata:
  name: wanderlust-deployment
  namespace: wanderlust
  labels:
    app.kubernetes.io/name: wanderlust
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wanderlust
  template:
    metadata:
      labels:
        app: wanderlust
    spec:
      containers:
        - name: wanderlust
          image: wanderlust:latest # Replace with your container registry path (e.g. username/wanderlust:latest)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: wanderlust-config
          env:
            - name: ATLASDB_URL
              valueFrom:
                secretKeyRef:
                  name: wanderlust-secret
                  key: ATLASDB_URL
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: wanderlust-secret
                  key: SECRET
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: wanderlust-secret
                  key: CLOUD_NAME
            - name: CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wanderlust-secret
                  key: CLOUD_API_KEY
            - name: CLOUD_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: wanderlust-secret
                  key: CLOUD_API_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
